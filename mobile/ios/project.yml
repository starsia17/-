name: Portfoliv
options:
  bundleIdPrefix: com.portfoliv
  deploymentTarget:
    iOS: '15.0'
targets:
  Portfoliv:
    type: application
    platform: iOS
    sources: [Portfoliv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portfoliv.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 포트폴리브
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
